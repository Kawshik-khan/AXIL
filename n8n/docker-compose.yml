# Local n8n for CommerceOS. The simplest route is `node n8n/deployment/setup-local-n8n.mjs`, which also imports the
# credential and workflows (see n8n/deployment/import.md). With compose instead: create n8n/.env first (that script
# writes it; it holds COMMERCEOS_N8N_WEBHOOK_SECRET and is git-ignored), then `docker compose up -d` here.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: commerceos-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Dhaka
      - TZ=Asia/Dhaka
      - COMMERCEOS_API_BASE_URL=http://host.docker.internal:3000
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - N8N_LOG_LEVEL=info
      # The Code nodes read COMMERCEOS_N8N_WEBHOOK_SECRET and compute an HMAC to verify calls from CommerceOS (FX-55)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/n8n/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    name: commerceos_n8n_data
