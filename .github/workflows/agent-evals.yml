# Live agent eval gate (FX-80, audit F12). Live runs spend real model tokens, so they never run on their own:
#   - Every PR: only the free offline eval gate (`npm run test:eval` in ci.yml, demo model, no tokens).
#   - Manual: Actions > Agent evals > "Run workflow" (workflow_dispatch). Pick the branch and the suite: `smoke`
#     (26 cases, the default, cheapest) or `full` (golden + red-team + real-embedding retrieval eval).
#     CLI: gh workflow run agent-evals.yml --ref <branch> -f suite=smoke|full
#   - A PR on demand: add the `run-live-eval` label to run the smoke subset once. New pushes do not re-run it;
#     remove and re-add the label to run it again.
# Merging to main never starts a live run (there is no schedule; the deploy gate in deploy.yml is off unless
# AGENT_EVAL_GATE=on). All live runs use the provider profile below, with an eval key kept in the `evals`
# environment, never the production key.
name: Agent evals

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = 26-case subset (cheap); full = all golden + red-team cases and the retrieval eval"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Keyed on the label too: adding some other label to a PR must not cancel a live run already in progress
  group: agent-evals-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  live:
    name: Golden + red-team on the configured model
    # PRs: only when the run-live-eval label was just added, and never for forks (they never get the eval key)
    if: >-
      github.event_name != 'pull_request' ||
        (github.event.label.name == 'run-live-eval' &&
         github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: evals
    env:
      TEST_LLM_LIVE: "1"
      # smoke: a labeled PR, or a manual run that picked smoke. full: a manual run that picked full.
      SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite }}
      # Provider profile under test (implementation plan §2a). Switching provider = changing these lines.
      LLM_PROVIDER_NAME: mwapi
      LLM_BASE_URL: https://api.mwapi.dev/v1
      LLM_MODEL_FAST: claude-haiku-4-5-20251001
      LLM_MODEL_REASONING: claude-haiku-4-5-20251001
      LLM_REASONING_EFFORT: medium
      # Anthropic list prices for Haiku 4.5; replace with mwapi's own prices if they differ
      LLM_PRICING_JSON: '{"TIER_1_FAST":{"promptCostPer1M":1,"cachedPromptCostPer1M":0.1,"completionCostPer1M":5},"TIER_2_REASONING":{"promptCostPer1M":1,"cachedPromptCostPer1M":0.1,"completionCostPer1M":5}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Smoke subset (labeled PR / manual smoke)
        if: env.SUITE == 'smoke'
        env:
          EVAL_CASES: G01,G03,G06,G19,G25,G28,G33,G37,G41,G44,G55,G59,R03,R04,R06,R07,R11,R12,R16,R21,R25,R26,R27,R35,R42,R43
          LLM_API_KEY: ${{ secrets.LLM_EVAL_API_KEY }}
        shell: bash # pipefail: an aborted eval fails this step instead of tee's 0 hiding it
        run: node tests/ts-runner.cjs ./tests/agent-evals/run-evals.ts | tee eval.log
      - name: Full suite (manual full)
        if: env.SUITE == 'full'
        shell: bash # pipefail: an aborted eval fails this step instead of tee's 0 hiding it
        run: node tests/ts-runner.cjs ./tests/agent-evals/run-evals.ts | tee eval.log
        env:
          LLM_API_KEY: ${{ secrets.LLM_EVAL_API_KEY }}
      - name: Gate
        run: node tests/agent-evals/check-thresholds.mjs "$(ls -d tests/agent-evals/results/live-* | tail -1)"
      # FX-82: Recall@2 ≥ 95% per language with real embeddings (manual full run; synthetic policy text only)
      - name: Retrieval eval (manual full)
        if: env.SUITE == 'full'
        env:
          EVAL_REAL_EMBEDDINGS: "1"
          LLM_EMBEDDING_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          LLM_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
          LLM_EMBEDDING_MODEL: gemini-embedding-001
          LLM_EMBEDDING_DIMENSIONS: "1536"
          # A 429 retry waits for the provider's Retry-After (up to 20 s) instead of the 2 s cap used in production
          EMBEDDING_RATE_LIMIT_MAX_WAIT_MS: "20000"
        run: node tests/ts-runner.cjs ./tests/agent-evals/retrieval-eval.ts
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: tests/agent-evals/results/
          retention-days: 30
      - name: Comment summary on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const root = "tests/agent-evals/results";
            const dir = fs.existsSync(root) ? fs.readdirSync(root).filter((d) => d.startsWith("live-")).sort().pop() : null;
            if (!dir) return;
            const s = JSON.parse(fs.readFileSync(`${root}/${dir}/summary.json`, "utf8"));
            const body = "### Agent eval (smoke)\n```json\n" + JSON.stringify(s, null, 2).slice(0, 60000) + "\n```";
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
