# Live agent eval gate (FX-80, audit F12). Live runs spend real model tokens, so they are rationed:
#   - Every PR: only the free offline eval gate (`npm run test:eval` in ci.yml, demo model, no tokens).
#   - Nightly: the full live suite, skipped when main has not changed since the last completed nightly run.
#   - A PR on demand: add the `run-live-eval` label to run the 26-case smoke subset once. New pushes do not re-run it;
#     remove and re-add the label to run it again.
#   - Manual: "Run workflow" (workflow_dispatch) always runs the full suite.
# All live runs use the provider profile below, with an eval key kept in the `evals` environment, never the production key.
name: Agent evals

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "30 21 * * *" # 03:30 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read # the nightly change check reads this workflow's previous runs

concurrency:
  # Keyed on the label too: adding some other label to a PR must not cancel a live run already in progress
  group: agent-evals-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  changed:
    name: Main changed since the last nightly run?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/agent-evals.yml/runs?event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main is still at $last, already evaluated by the last nightly run: skipping (no tokens spent)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from '${last:-none}' to ${{ github.sha }}: running the full live eval."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  live:
    name: Golden + red-team on the configured model
    needs: changed
    # PRs: only when the run-live-eval label was just added, and never for forks (they never get the eval key)
    if: >-
      needs.changed.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
        (github.event.label.name == 'run-live-eval' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: evals
    env:
      TEST_LLM_LIVE: "1"
      # Provider profile under test (implementation plan §2a). Switching provider = changing these lines.
      LLM_PROVIDER_NAME: ollama-cloud
      LLM_BASE_URL: https://ollama.com/v1
      LLM_MODEL_FAST: gpt-oss:120b
      LLM_MODEL_REASONING: gpt-oss:120b
      LLM_PRICING_JSON: '{"TIER_1_FAST":{"promptCostPer1M":0.15,"cachedPromptCostPer1M":0.014,"completionCostPer1M":0.6}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Smoke subset (PR)
        if: github.event_name == 'pull_request'
        env:
          EVAL_CASES: G01,G03,G06,G19,G25,G28,G33,G37,G41,G44,G55,G59,R03,R04,R06,R07,R11,R12,R16,R21,R25,R26,R27,R35,R42,R43
          LLM_API_KEY: ${{ secrets.OLLAMA_EVAL_API_KEY }}
        shell: bash # pipefail: an aborted eval fails this step instead of tee's 0 hiding it
        run: node tests/ts-runner.cjs ./tests/agent-evals/run-evals.ts | tee eval.log
      - name: Full suite (nightly / manual)
        if: github.event_name != 'pull_request'
        shell: bash # pipefail: an aborted eval fails this step instead of tee's 0 hiding it
        run: node tests/ts-runner.cjs ./tests/agent-evals/run-evals.ts | tee eval.log
        env:
          LLM_API_KEY: ${{ secrets.OLLAMA_EVAL_API_KEY }}
      - name: Gate
        run: node tests/agent-evals/check-thresholds.mjs "$(ls -d tests/agent-evals/results/live-* | tail -1)"
      # FX-82: Recall@2 ≥ 95% per language with real embeddings (nightly; synthetic policy text only)
      - name: Retrieval eval (nightly / manual)
        if: github.event_name != 'pull_request'
        env:
          EVAL_REAL_EMBEDDINGS: "1"
          LLM_EMBEDDING_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          LLM_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
          LLM_EMBEDDING_MODEL: gemini-embedding-001
          LLM_EMBEDDING_DIMENSIONS: "1536"
          # A 429 retry waits for the provider's Retry-After (up to 20 s) instead of the 2 s cap used in production
          EMBEDDING_RATE_LIMIT_MAX_WAIT_MS: "20000"
        run: node tests/ts-runner.cjs ./tests/agent-evals/retrieval-eval.ts
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: tests/agent-evals/results/
          retention-days: 30
      - name: Comment summary on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const root = "tests/agent-evals/results";
            const dir = fs.existsSync(root) ? fs.readdirSync(root).filter((d) => d.startsWith("live-")).sort().pop() : null;
            if (!dir) return;
            const s = JSON.parse(fs.readFileSync(`${root}/${dir}/summary.json`, "utf8"));
            const body = "### Agent eval (smoke)\n```json\n" + JSON.stringify(s, null, 2).slice(0, 60000) + "\n```";
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
