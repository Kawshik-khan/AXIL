name: Deploy

# Runs after CI has passed on main. Render auto-deploy is off (render.yaml): this workflow is the only thing that deploys.
# Every job requires a PUSH to main in THIS repository: a fork's pull request from a branch named "main" also triggers
# CI, and must never deploy or see a secret (Stage 4 security review).
# Optional staging first: set the repository variable STAGING_BASE_URL and the secret STAGING_DEPLOY_HOOK_URL.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy this commit
        id: deploy
        env:
          HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::STAGING_DEPLOY_HOOK_URL is not set, so staging was NOT deployed. Add it under Settings, Secrets and variables, Actions (docs/ci-setup.md)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${HOOK_URL}&ref=${SHA}" >/dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke-deploy.mjs
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}

  # FX-86: the agent eval smoke subset (26 cases) on the configured provider profile, before any production deploy.
  # Turned on by the repository variable AGENT_EVAL_GATE=on (do it before the customer-agent pilot); needs the `evals`
  # environment with OLLAMA_EVAL_API_KEY. With the gate on and no key, it fails rather than deploying ungated.
  agent-eval-gate:
    name: Agent eval smoke
    needs: [staging]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && vars.AGENT_EVAL_GATE == 'on' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 60
    env:
      TEST_LLM_LIVE: "1"
      LLM_PROVIDER_NAME: ollama-cloud
      LLM_BASE_URL: https://ollama.com/v1
      LLM_MODEL_FAST: gpt-oss:120b
      LLM_MODEL_REASONING: gpt-oss:120b
      EVAL_CASES: G01,G03,G06,G19,G25,G28,G33,G37,G41,G44,G55,G59,R03,R04,R06,R07,R11,R12,R16,R21,R25,R26,R27,R35,R42,R43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: test -n "$LLM_API_KEY" || (echo "::error::AGENT_EVAL_GATE is on but OLLAMA_EVAL_API_KEY is missing in the evals environment." && exit 1)
        env:
          LLM_API_KEY: ${{ secrets.OLLAMA_EVAL_API_KEY }}
      # npm ci runs install scripts: the key is not in its environment
      - run: npm ci
      - run: node tests/ts-runner.cjs ./tests/agent-evals/run-evals.ts
        env:
          LLM_API_KEY: ${{ secrets.OLLAMA_EVAL_API_KEY }}
      - run: node tests/agent-evals/check-thresholds.mjs "$(ls -d tests/agent-evals/results/live-* | tail -1)"

  production:
    name: Production
    needs: [staging, agent-eval-gate]
    # Runs when staging passed (or no staging service is configured) and the agent eval gate passed (or is off).
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && (needs.staging.result == 'success' || needs.staging.result == 'skipped') && (needs.agent-eval-gate.result == 'success' || needs.agent-eval-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for a manual approval step
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy this commit
        id: deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so production was NOT deployed. Add it under Settings, Secrets and variables, Actions (docs/ci-setup.md)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${HOOK_URL}&ref=${SHA}" >/dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/smoke-deploy.mjs
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      - name: Open an issue when the deploy or smoke test failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Production deploy or smoke test failed for ${GITHUB_SHA::7}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Roll back from the Render dashboard (Events, Rollback) if the site is unhealthy; docs/render-runbook.md."
