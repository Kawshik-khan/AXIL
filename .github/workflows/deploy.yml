name: Deploy

# Runs after CI has passed on main. Render auto-deploy is off (render.yaml): this workflow is the only thing that deploys.
# Optional staging first: set the repository variable STAGING_BASE_URL and the secret STAGING_DEPLOY_HOOK_URL.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    if: github.event.workflow_run.conclusion == 'success' && vars.STAGING_BASE_URL != ''
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy this commit
        run: curl --fail-with-body -sS -X POST "${{ secrets.STAGING_DEPLOY_HOOK_URL }}&ref=${{ github.event.workflow_run.head_sha }}" >/dev/null
      - name: Smoke test
        run: node scripts/smoke-deploy.mjs
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}

  production:
    name: Production
    needs: [staging]
    # Runs when staging passed, or was skipped because no staging service is configured.
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production # add required reviewers here for a manual approval step
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy this commit
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&ref=${{ github.event.workflow_run.head_sha }}" >/dev/null
      - name: Smoke test
        run: node scripts/smoke-deploy.mjs
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      - name: Open an issue when the deploy or smoke test failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Production deploy or smoke test failed for ${GITHUB_SHA::7}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Roll back from the Render dashboard (Events, Rollback) if the site is unhealthy; docs/render-runbook.md."
