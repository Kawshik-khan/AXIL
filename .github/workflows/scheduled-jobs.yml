name: Scheduled jobs

# Free replacement for a paid Render Cron Job (FX-99 Part B, without n8n): calls POST /api/v1/jobs/<job>/run for every
# job (scripts/run-scheduled-jobs.mjs). The app runs each job at most once per its own period (daily report and low
# stock at the shop's local hour, courier poll every 30 min, ...), so calling all of them every 10 minutes is safe.
# GitHub may start a scheduled run a few minutes late; nothing here depends on the exact minute.
#
# Repository secrets: JOBS_TOKEN (its SHA-256 is JOBS_TOKEN_SHA256 on the Render web service) and APP_URL (https).
# Schedules only run on the default branch; "Run workflow" (workflow_dispatch) needs write access to the repository.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run due jobs
    if: github.repository == 'Kawshik-khan/AXIL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/run-scheduled-jobs.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node built-ins only: no npm install
      - name: Call the jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: node scripts/run-scheduled-jobs.mjs
