name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without a code change
  workflow_dispatch: # re-run on demand, e.g. after rotating a leaked secret

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on any high/critical advisory not listed, with a reason and an expiry, in security/audit-exceptions.json.
      - run: node scripts/audit-gate.mjs

  secrets:
    # The job name is a required status check on main (docs/ci-setup.md): keep it.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks CLI is pinned and checksum-verified instead of using gitleaks/gitleaks-action, which bundles an
      # old gitleaks (no per-rule allowlists), runs on the deprecated Node 20, needs a paid license once the repo
      # belongs to an organization, and scans a different commit range per event (the cause of green PRs but a
      # red weekly run). Dependabot does not bump this: update both values together from the release's
      # gitleaks_<version>_checksums.txt (https://github.com/gitleaks/gitleaks/releases).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still exposed
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # Rules and narrow exceptions: .gitleaks.toml. Reviewed one-off false positives: .gitleaksignore.
      - name: Scan git history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Every event scans the whole history of the checked-out commit, so a PR, a push and the weekly run
          # give the same answer. The weekly and manual runs also scan every branch and tag, since a secret on
          # any pushed branch is already exposed.
          log_opts="HEAD"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then log_opts="--all"; fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$log_opts" --redact --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks-report.json
      - name: Summarize findings
        if: failure() && hashFiles('gitleaks-report.json') != ''
        run: |
          {
            echo "## Secret scan: $(jq length gitleaks-report.json) finding(s)"
            echo
            echo "Values are redacted. If one is a real secret, rotate it first; removing it from the code does not"
            echo "remove it from git history. Handling false positives: docs/ci-setup.md, \"Secret scan\"."
            echo
            echo "| Rule | File | Line | Commit | Fingerprint |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) | `\(.Fingerprint)` |"' gitleaks-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted report
        if: failure() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
